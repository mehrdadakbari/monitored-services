services:
  nginx:
    image: nginx:alpine
    container_name: monitored-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    env_file:
      - ./backend/.env
    volumes:
      - ./nginx/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - frontend
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: monitored-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    expose:
      - "3333"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
      - sqlite_data:/app/tmp
    command: >
      sh -c "node ace migration:run &&
             node ace db:seed &&
             node ace scheduler:run &
             node ace serve --watch"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: monitored-frontend
    restart: unless-stopped
    expose:
      - "3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    env_file:
      - ./frontend/.env
    depends_on:
      - backend

volumes:
  sqlite_data:
  backend_node_modules:
